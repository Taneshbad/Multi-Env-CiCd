name: Build and Push

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Image
        run: |
          docker build \
            -t ghcr.io/taneshbad/multi-env-cicd:${{ github.sha }} \
            -t ghcr.io/taneshbad/multi-env-cicd:latest \
            .

      - name: Push SHA Tag
        run: |
          docker push ghcr.io/taneshbad/multi-env-cicd:${{ github.sha }}

      - name: Push Latest Tag
        run: |
          docker push ghcr.io/taneshbad/multi-env-cicd:latest
